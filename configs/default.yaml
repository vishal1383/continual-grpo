methods: [grpo, skill_ortho, copsd, combined]
model: Qwen/Qwen2.5-7B-Instruct
output_dir: outputs/default_7b_r32
protected_anchors:
  - name: mmlu
    dataset: cais/mmlu
    subset: all
    split: validation
    max_samples: 32
  - name: bbq
    dataset: oskarvanderwal/bbq
    subset: All
    split: test
    max_samples: 32
anchor_batch_size: 2
protected_rank: 2
spectral_target_rank: 1
opsd_margin: 0.2
opsd_negative_weight: 0.1
opsd_temperature: 1.0
opsd_weight: 0.1
seed: 42
kl_beta: 0.04
learning_rate: 5.0e-6
epochs: 1
per_device_batch_size: 1
gradient_accumulation_steps: 8
prompt_batch_size: 1
num_generations: 4
max_prompt_length: 512
max_completion_length: 256
rollout_temperature: 0.8
rollout_top_p: 0.95
bf16: true
max_grad_norm: 1.0
gradient_checkpointing: true
finetune_mode: lora
lora_r: 32
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
tasks:
  - name: gsm8k
    dataset: openai/gsm8k
    subset: main
    split: train
    prompt_field: question
    answer_field: answer
    max_samples: 256
  - name: math
    dataset: DigitalLearningGmbH/MATH-lighteval
    subset: default
    split: train
    max_samples: 256
eval_tasks: [gsm8k, hendrycks_math, humaneval, bbq, mmlu]
bias_eval:
  n_eval: 0
  eval_batch: 8
  score_batch: 2
  mcq_prompt_count: 1
  toxicity_prompt_count: 1
eval_batch_size: 4
max_memory_per_gpu: 70GB
vllm_gpu_memory_utilization: 0.70
