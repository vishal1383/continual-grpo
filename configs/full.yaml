methods: [grpo, skill_ortho, copsd, combined]
models:
  - Qwen/Qwen2.5-0.5B-Instruct
  - Qwen/Qwen2.5-3B-Instruct
  - Qwen/Qwen2.5-7B-Instruct
output_dir: outputs/full
protected_anchors:
  - name: bbq
    dataset: oskarvanderwal/bbq
    subset: All
    split: test
    prompt_field: context
    answer_field: question
    max_samples: 64
anchor_batch_size: 2
protected_rank: 2
spectral_target_rank: 1
opsd_margin: 0.2
opsd_negative_weight: 0.1
opsd_temperature: 1.0
seed: 42
kl_beta: 0.04
learning_rate: 5.0e-6
epochs: 1
per_device_batch_size: 4
gradient_accumulation_steps: 4
num_generations: 4
max_prompt_length: 512
max_completion_length: 512
bf16: true
max_grad_norm: 1.0
gradient_checkpointing: true
finetune_mode: lora
lora_r: 32
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
tasks:
  - name: gsm8k
    dataset: openai/gsm8k
    subset: main
    split: train
    prompt_field: question
    answer_field: answer
    max_samples: 0
eval_tasks: [gsm8k, humaneval, bbq]
eval_batch_size: 4
max_memory_per_gpu: 70GB
vllm_gpu_memory_utilization: 0.70
