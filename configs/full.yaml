methods: [grpo, skill_ortho, copsd, combined]
models:
  - Qwen/Qwen2.5-3B-Instruct
  - Qwen/Qwen2.5-7B-Instruct
output_dir: outputs/full_handwritten_adamw
protected_anchors:
  - name: mmlu
    dataset: cais/mmlu
    subset: all
    split: validation
    max_samples: 64
  - name: bbq
    dataset: oskarvanderwal/bbq
    subset: All
    split: test
    max_samples: 64
anchor_batch_size: 2
protected_rank: 2
spectral_target_rank: 1
opsd_margin: 0.2
opsd_negative_weight: 0.1
opsd_temperature: 1.0
opsd_weight: 0.1
seed: 42
kl_beta: 0.04
learning_rate: 2.0e-5
weight_decay: 0.0
optimizer: adamw
warmup_ratio: 0.1
epochs: 4
per_device_batch_size: 8
gradient_accumulation_steps: 4
prompt_batch_size: 1
num_generations: 8
max_prompt_length: 512
max_completion_length: 512
rollout_temperature: 0.8
rollout_top_p: 1.0
bf16: true
max_grad_norm: 1.0
gradient_checkpointing: true
finetune_mode: lora
lora_r: 32
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
tasks:
  - name: gsm8k
    dataset: openai/gsm8k
    subset: main
    split: train
    prompt_field: question
    answer_field: answer
    rollout_source:
      Qwen/Qwen2.5-3B-Instruct: external_rollouts/qwen2.5-3b_gsm8k_k4.jsonl
      Qwen/Qwen2.5-7B-Instruct: external_rollouts/qwen2.5-7b_gsm8k_k4.jsonl
    max_samples: 0
  - name: math
    dataset: DigitalLearningGmbH/MATH-lighteval
    subset: default
    split: train
    max_samples: 0
eval_tasks: [gsm8k, hendrycks_math, humaneval, bbq, mmlu]
bias_eval:
  n_eval: 0
  eval_batch: 8
  score_batch: 2
  mcq_prompt_count: 1
  toxicity_prompt_count: 1
eval_batch_size: 4
max_memory_per_gpu: 70GB
vllm_gpu_memory_utilization: 0.70
