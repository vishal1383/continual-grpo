methods: [grpo, skill_ortho, copsd, combined]
models:
  - Qwen/Qwen2.5-0.5B-Instruct
output_dir: outputs/smoke
protected_anchors:
  - name: bbq
    dataset: oskarvanderwal/bbq
    subset: All
    split: test
    prompt_field: context
    answer_field: question
    max_samples: 4
anchor_batch_size: 2
protected_rank: 2
spectral_target_rank: 1
opsd_margin: 0.2
opsd_negative_weight: 0.1
opsd_temperature: 1.0
seed: 42
kl_beta: 0.04
learning_rate: 5.0e-6
epochs: 1
per_device_batch_size: 2
gradient_accumulation_steps: 1
num_generations: 2
max_prompt_length: 256
max_completion_length: 64
bf16: true
max_grad_norm: 1.0
gradient_checkpointing: true
use_lora: true
lora_r: 8
tasks:
  - name: gsm8k
    dataset: openai/gsm8k
    subset: main
    split: train
    prompt_field: question
    answer_field: answer
    max_samples: 1
eval_tasks: [gsm8k, humaneval, bbq_smoke]
eval_limits:
  gsm8k: 1
  humaneval: 1
eval_batch_size: 1
max_memory_per_gpu: 70GB
vllm_gpu_memory_utilization: 0.70
