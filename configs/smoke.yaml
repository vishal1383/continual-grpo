methods: [grpo, skill_ortho, copsd, combined]
models:
  - Qwen/Qwen2.5-7B-Instruct
output_dir: outputs/smoke_7b_handwritten_adamw
protected_anchors:
  - name: mmlu
    dataset: cais/mmlu
    subset: all
    split: validation
    max_samples: 4
  - name: bbq
    dataset: oskarvanderwal/bbq
    subset: All
    split: test
    max_samples: 4
anchor_batch_size: 2
protected_rank: 2
spectral_target_rank: 1
opsd_margin: 0.2
opsd_negative_weight: 0.1
opsd_temperature: 1.0
opsd_weight: 0.1
seed: 42
kl_beta: 0.04
learning_rate: 2.0e-5
weight_decay: 0.0
optimizer: adamw
warmup_ratio: 0.1
# Two passes over the one-group smoke buffer: pass 1 establishes an update;
# pass 2 verifies that the fixed-old-policy ratio and clipping are active.
epochs: 2
per_device_batch_size: 4
gradient_accumulation_steps: 1
prompt_batch_size: 1
num_generations: 4
max_prompt_length: 256
max_completion_length: 256
rollout_temperature: 0.8
rollout_top_p: 1.0
bf16: true
max_grad_norm: 1.0
gradient_checkpointing: true
finetune_mode: lora
lora_r: 16
lora_alpha: 16
lora_dropout: 0.0
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
tasks:
  - name: gsm8k
    dataset: openai/gsm8k
    subset: main
    split: train
    prompt_field: question
    answer_field: answer
    rollout_source: external_rollouts/qwen2.5-7b_gsm8k_k4.jsonl
    max_samples: 1
  - name: math
    dataset: DigitalLearningGmbH/MATH-lighteval
    subset: default
    split: train
    level: Level 1
    max_samples: 8
    min_signal_groups: 1
eval_tasks: [gsm8k, hendrycks_math, humaneval, bbq_smoke, mmlu]
eval_limits:
  gsm8k: 1
  hendrycks_math: 1
  humaneval: 1
  mmlu: 1
bias_eval:
  n_eval: 8
  eval_batch: 2
  score_batch: 2
  mcq_prompt_count: 1
  toxicity_prompt_count: 1
eval_batch_size: 1
max_memory_per_gpu: 70GB
vllm_gpu_memory_utilization: 0.70
