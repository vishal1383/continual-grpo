services:
  experiment:
    image: continual-grpo:v2
    build: .
    entrypoint: ["sleep", "infinity"]
    environment:
      TORCH_DISABLE_NATIVE_JIT: "1"
    ipc: host
    shm_size: 32gb
    mem_limit: 70g
    volumes:
      - .:/workspace
      - ./outputs:/workspace/outputs
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
volumes:
  hf-cache:
